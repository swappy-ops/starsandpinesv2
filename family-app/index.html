<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f8f8f6" />
  <title>Stars & Pines — Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sp-ink:        #1a1714;
      --sp-ink-soft:   #3a3530;
      --sp-body:       #5a5047;
      --sp-muted:      #8a7e72;
      --sp-faint:      #b0a898;
      --sp-paper:      #f6f1ea;
      --sp-cream:      #f0ebe3;
      --sp-mist:       #e8e2d8;
      --sp-border:     #d4c9b8;
      --sp-border-soft:#e5dcc8;
      --sp-pine:       #2d4030;
      --sp-pine-deep:  #1f2f1d;
      --sp-warm:       #c4a55a;
      --sp-alert:      #b05050;
      --sp-green:      #4a8a62;
      --sp-font-display: 'Playfair Display', Georgia, serif;
      --sp-font-body:    'EB Garamond', Georgia, serif;
      --sp-font-ui:      'DM Sans', system-ui, sans-serif;
      --sp-font-mono:    'DM Mono', 'SF Mono', monospace;
      --space-xxs: 4px;
      --space-xs:  8px;
      --space-sm:  12px;
      --space-md:  16px;
      --space-lg:  24px;
      --space-xl:  32px;
      --space-2xl: 48px;
      --radius-none: 0px;
      --radius-sm:   2px;
      --col-gap: 20px;
      --page-max: 1200px;
      --content-max: 720px;
    }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      background: var(--sp-paper);
      color: var(--sp-ink);
      font-family: var(--sp-font-ui);
      font-weight: 400;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ─── GRID ─── */
    .page { max-width: var(--page-max); margin: 0 auto; padding: 0 var(--space-md); }
    @media (min-width: 768px) { .page { padding: 0 var(--space-lg); } }
    @media (min-width: 1024px) { .page { padding: 0 var(--space-xl); } }

    /* ─── HEADER ─── */
    .app-header {
      padding: var(--space-md) 0;
      border-bottom: 1px solid var(--sp-border-soft);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .app-header h1 {
      font-family: var(--sp-font-display);
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--sp-pine);
      letter-spacing: -0.02em;
    }
    .app-header .meta {
      font-size: 0.65rem;
      color: var(--sp-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .header-actions { display: flex; gap: var(--space-xs); align-items: center; }
    .operator-picker { display: flex; align-items: center; gap: var(--space-xs); }
    .operator-picker select {
      min-height: 32px;
      padding: 4px 28px 4px 8px;
      border: 1px solid var(--sp-border);
      background: var(--sp-paper);
      color: var(--sp-ink);
      font: 500 0.65rem var(--sp-font-ui);
    }
    .btn-ghost {
      background: none;
      border: 1px solid var(--sp-border);
      color: var(--sp-muted);
      padding: var(--space-xs) var(--space-sm);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--sp-font-ui);
      transition: border-color var(--duration-fast);
    }
    .btn-ghost:hover { border-color: var(--sp-warm); color: var(--sp-pine); }
    .btn-ghost.danger { border-color: rgba(176,80,80,0.2); color: var(--sp-alert); }

    /* ─── NAVIGATION (wayfinding) ─── */
    .app-nav {
      display: flex;
      border-bottom: 1px solid var(--sp-border-soft);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .app-nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      flex: 0 0 auto;
      padding: var(--space-sm) var(--space-md);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sp-muted);
      font-family: var(--sp-font-ui);
      font-weight: 400;
      transition: color var(--duration-fast);
      white-space: nowrap;
    }
    .nav-btn .num {
      color: var(--sp-faint);
      margin-right: var(--space-xs);
      font-family: var(--sp-font-mono);
      font-size: 0.55rem;
    }
    .nav-btn.active { border-bottom-color: var(--sp-pine); color: var(--sp-ink); font-weight: 500; }
    .nav-btn.active .num { color: var(--sp-pine); }
    .nav-btn:hover { color: var(--sp-body); }

    /* ─── PANELS ─── */
    .panel { display: none; padding: var(--space-lg) 0; }
    .panel.active { display: block; }

    /* ─── TYPOGRAPHY ─── */
    .display {
      font-family: var(--sp-font-display);
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--sp-ink);
    }
    .section-title {
      font-family: var(--sp-font-ui);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sp-muted);
      padding-bottom: var(--space-xs);
      margin-bottom: var(--space-md);
      border-bottom: 1px solid var(--sp-border-soft);
    }
    .section-title .num {
      font-family: var(--sp-font-mono);
      color: var(--sp-faint);
      margin-right: var(--space-xs);
    }
    .label {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sp-muted);
    }
    .mono { font-family: var(--sp-font-mono); font-size: 0.8rem; letter-spacing: 0.04em; }
    .mono-lg { font-size: 1.4rem; letter-spacing: 0.08em; }

    /* ─── PROPERTY OVERVIEW (replaces stat cards) ─── */
    .overview {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--sp-border-soft);
      border: 1px solid var(--sp-border-soft);
      margin-bottom: var(--space-lg);
    }
    @media (min-width: 600px) { .overview { grid-template-columns: repeat(4, 1fr); } }
    .overview-cell {
      background: white;
      padding: var(--space-md);
    }
    .overview-value {
      font-family: var(--sp-font-display);
      font-size: 1.8rem;
      font-weight: 400;
      line-height: 1.1;
      color: var(--sp-ink);
    }
    .overview-value.warn { color: var(--sp-alert); }
    .overview-value.ok { color: var(--sp-green); }
    .overview-label {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sp-muted);
      margin-top: var(--space-xs);
    }

    /* ─── ROOM TABLE (replaces room cards) ─── */
    .room-table {
      width: 100%;
      border-collapse: collapse;
    }
    .room-table th {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sp-muted);
      font-weight: 500;
      text-align: left;
      padding: var(--space-xs) var(--space-sm);
      border-bottom: 1px solid var(--sp-border-soft);
      background: var(--sp-cream);
    }
    .room-table td {
      padding: var(--space-sm) var(--space-sm);
      border-bottom: 1px solid var(--sp-border-soft);
      font-size: 0.85rem;
      vertical-align: middle;
    }
    .room-table tr:last-child td { border-bottom: none; }
    .room-table .room-name { font-weight: 500; color: var(--sp-ink); }
    .room-table .room-type { font-size: 0.65rem; color: var(--sp-muted); }
    .room-table .guest-name { color: var(--sp-ink); }
    .room-table .vacant { color: var(--sp-faint); font-style: italic; }

    /* ─── STATUS INDICATORS (geometric, no emoji) ─── */
    .status {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.pending { background: var(--sp-alert); }
    .status-dot.preparing { background: var(--sp-warm); }
    .status-dot.served { background: var(--sp-green); }
    .status-dot.cancelled { background: var(--sp-faint); }
    .status-dot.occupied { background: var(--sp-alert); }
    .status-dot.available { background: var(--sp-green); }

    /* ─── KITCHEN QUEUE (dense, scannable) ─── */
    .kitchen-list { list-style: none; }
    .kitchen-item {
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--sp-border-soft);
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: var(--space-md);
      align-items: start;
    }
    @media (min-width: 600px) { .kitchen-item { grid-template-columns: 100px 1fr 120px auto; } }
    .kitchen-item:last-child { border-bottom: none; }
    .kitchen-time {
      font-family: var(--sp-font-mono);
      font-size: 0.7rem;
      color: var(--sp-muted);
      padding-top: 2px;
    }
    .kitchen-room {
      font-weight: 500;
      font-size: 0.85rem;
      color: var(--sp-ink);
    }
    .kitchen-items {
      font-size: 0.8rem;
      color: var(--sp-body);
      line-height: 1.6;
    }
    .kitchen-items li { list-style: none; }
    .kitchen-items .qty {
      font-family: var(--sp-font-mono);
      color: var(--sp-muted);
      margin-right: var(--space-xs);
    }
    .kitchen-actions { display: flex; gap: var(--space-xs); align-items: center; }

    /* ─── BUTTONS ─── */
    .btn {
      padding: var(--space-xs) var(--space-sm);
      border: none;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--sp-font-ui);
      transition: all var(--duration-fast);
    }
    .btn-start { background: var(--sp-warm); color: var(--sp-pine-deep); }
    .btn-start:hover { background: var(--sp-pine); color: white; }
    .btn-serve { background: var(--sp-green); color: white; }
    .btn-serve:hover { background: var(--sp-pine-deep); }
    .btn-cancel { background: none; border: 1px solid var(--sp-border); color: var(--sp-muted); }
    .btn-cancel:hover { border-color: var(--sp-alert); color: var(--sp-alert); }
    .btn-primary { background: var(--sp-pine); color: white; }
    .btn-primary:hover { background: var(--sp-pine-deep); }
    .btn-full { width: 100%; padding: var(--space-sm); }

    /* ─── INVENTORY TABLE ─── */
    .inv-table {
      width: 100%;
      border-collapse: collapse;
    }
    .inv-table th {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sp-muted);
      font-weight: 500;
      text-align: left;
      padding: var(--space-xs) var(--space-sm);
      border-bottom: 1px solid var(--sp-border-soft);
      background: var(--sp-cream);
    }
    .inv-table th:last-child { text-align: right; }
    .inv-table td {
      padding: var(--space-xs) var(--space-sm);
      border-bottom: 1px solid var(--sp-border-soft);
      font-size: 0.82rem;
    }
    .inv-table tr:last-child td { border-bottom: none; }
    .inv-table .stock-low { color: var(--sp-alert); font-weight: 500; }
    .inv-table .stock-ok { color: var(--sp-green); }
    .inv-table .actions { text-align: right; white-space: nowrap; }
    .inv-btn {
      padding: 2px var(--space-xs);
      border: 1px solid var(--sp-border);
      background: none;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--sp-muted);
      font-family: var(--sp-font-ui);
      margin-left: var(--space-xs);
    }
    .inv-btn:hover { border-color: var(--sp-warm); color: var(--sp-pine); }

    /* ─── ALERT BANNER ─── */
    .alert-banner {
      padding: var(--space-sm) var(--space-md);
      border-left: 3px solid var(--sp-alert);
      background: rgba(176,80,80,0.04);
      margin-bottom: var(--space-lg);
    }
    .alert-banner .alert-title {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sp-alert);
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }
    .alert-banner .alert-item {
      font-size: 0.8rem;
      color: var(--sp-body);
      padding: 2px 0;
    }

    /* ─── BUSY BAR ─── */
    .busy-bar {
      padding: var(--space-sm) var(--space-md);
      border-left: 3px solid var(--sp-warm);
      background: rgba(196,165,90,0.04);
      margin-bottom: var(--space-lg);
    }
    .busy-bar .busy-title {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sp-warm);
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }
    .busy-bar .busy-items {
      font-size: 0.8rem;
      color: var(--sp-body);
    }
    .busy-bar .busy-eta {
      font-family: var(--sp-font-mono);
      font-size: 0.7rem;
      color: var(--sp-muted);
      margin-top: var(--space-xs);
    }

    /* ─── CHECKOUT ─── */
    .checkout-list { list-style: none; }
    .checkout-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--space-md);
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--sp-border-soft);
      align-items: center;
    }
    .checkout-item:last-child { border-bottom: none; }
    .checkout-guest { font-weight: 500; }
    .checkout-meta { font-size: 0.75rem; color: var(--sp-muted); }

    /* ─── BILL ─── */
    .bill {
      border: 1px solid var(--sp-border);
      padding: var(--space-lg);
      margin-top: var(--space-md);
    }
    .bill-title {
      font-family: var(--sp-font-display);
      font-size: 1.1rem;
      margin-bottom: var(--space-xs);
    }
    .bill-sub { font-size: 0.75rem; color: var(--sp-muted); margin-bottom: var(--space-md); }
    .bill-line {
      display: flex;
      justify-content: space-between;
      padding: var(--space-xs) 0;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--sp-border-soft);
    }
    .bill-line:last-child { border-bottom: none; }
    .bill-line.payment .bill-amount { color: var(--sp-green); }
    .bill-total {
      display: flex;
      justify-content: space-between;
      padding: var(--space-sm) 0 0;
      margin-top: var(--space-xs);
      border-top: 2px solid var(--sp-ink);
      font-size: 1rem;
      font-weight: 600;
    }

    /* ─── FORMS ─── */
    .form-group { margin-bottom: var(--space-sm); }
    .form-label {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sp-muted);
      margin-bottom: var(--space-xs);
    }
    .form-input, .form-select {
      width: 100%;
      padding: var(--space-xs) var(--space-sm);
      border: 1px solid var(--sp-border);
      font-size: 0.85rem;
      font-family: var(--sp-font-ui);
      background: white;
      color: var(--sp-ink);
      outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--sp-warm); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); }

    /* ─── AUTH ─── */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
      text-align: center;
      background: var(--sp-paper);
    }
    .auth-title {
      font-family: var(--sp-font-display);
      font-size: 1.6rem;
      color: var(--sp-pine);
      margin-bottom: var(--space-xs);
    }
    .auth-sub {
      font-size: 0.85rem;
      color: var(--sp-muted);
      margin-bottom: var(--space-xl);
    }
    .auth-form { width: 100%; max-width: 280px; }
    .auth-form .pin-input {
      font-family: var(--sp-font-mono);
      font-size: 1.8rem;
      text-align: center;
      letter-spacing: 0.5em;
      padding: var(--space-sm);
    }
    .auth-error {
      color: var(--sp-alert);
      font-size: 0.8rem;
      margin-top: var(--space-xs);
      display: none;
    }
    .auth-footer {
      margin-top: var(--space-xl);
      font-size: 0.7rem;
      color: var(--sp-faint);
      letter-spacing: 0.1em;
    }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: var(--space-lg);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--sp-pine-deep);
      color: var(--sp-paper);
      padding: var(--space-xs) var(--space-md);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      z-index: 1000;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.visible { transform: translateX(-50%) translateY(0); }

    /* ─── LOADING ─── */
    .loading { text-align: center; padding: var(--space-2xl) 0; color: var(--sp-muted); }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--sp-border-soft);
      border-top-color: var(--sp-warm);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto var(--space-sm);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── EMPTY ─── */
    .empty {
      text-align: center;
      padding: var(--space-2xl) 0;
      color: var(--sp-faint);
      font-size: 0.85rem;
    }
     /* ─── FIGMA PMS SHELL ─── */
     :root { --pms-canvas:#f5f5f5; --pms-rail:#13251f; --pms-rail-soft:#203b32; --pms-gold:#c4a55a; --pms-card:#fff; --pms-line:#e2e2df; }
     #dashboard-app { background:var(--pms-canvas); min-height:100vh; }
     #dashboard-app .page { max-width:none; min-height:100vh; padding:0 32px 48px 212px; position:relative; }
     #dashboard-app .app-header { padding:28px 0 20px; border-bottom:1px solid var(--pms-line); align-items:center; }
     #dashboard-app .app-header h1 { color:var(--sp-ink); font:600 20px var(--sp-font-ui); letter-spacing:-.03em; }
     #dashboard-app .app-header .meta { color:var(--sp-muted); font-size:10px; }
     #dashboard-app .app-nav { position:absolute; inset:0 auto 0 0; width:180px; min-height:100vh; padding:26px 16px; display:flex; flex-direction:column; align-items:stretch; gap:3px; background:var(--pms-rail); border:0; }
     #dashboard-app .app-nav::before { content:'STARS & PINES\A OPERATIONS'; white-space:pre; color:#f4f1e9; font:600 10px/1.7 var(--sp-font-ui); letter-spacing:.09em; padding:0 12px 36px; }
     #dashboard-app .nav-btn { width:100%; padding:11px 12px; text-align:left; color:rgba(245,245,245,.7); border:0; font-size:10px; letter-spacing:.05em; text-transform:none; }
     #dashboard-app .nav-btn .num { display:none; }
     #dashboard-app .nav-btn.active { background:var(--pms-gold); color:var(--pms-rail); font-weight:600; }
     #dashboard-app .nav-btn:hover { background:var(--pms-rail-soft); color:#fff; }
     #dashboard-app .nav-btn.active:hover { background:var(--pms-gold); color:var(--pms-rail); }
     #dashboard-app .panel { padding:28px 0 0; }
     #dashboard-app .display { font-size:28px; font-weight:600; letter-spacing:-.04em; }
     #dashboard-app .section-title { color:var(--sp-ink-soft); border-color:var(--pms-line); font-size:10px; letter-spacing:.08em; }
     #dashboard-app .overview, #dashboard-app .overview-cell, #dashboard-app .room-table, #dashboard-app .stays-table, #dashboard-app .kitchen-list, #dashboard-app .inventory-table, #dashboard-app .bill-card { background:var(--pms-card); border-color:var(--pms-line); }
     #dashboard-app .overview-cell { padding:18px; }
     #dashboard-app .overview-value { color:var(--sp-ink); font-weight:600; }
     #dashboard-app .overview-value.warn { color:var(--pms-gold); }
     #dashboard-app .btn-primary, #dashboard-app .btn-start, #dashboard-app .btn-serve { background:var(--pms-rail); color:#fff; }
     #dashboard-app .btn-primary:hover, #dashboard-app .btn-start:hover, #dashboard-app .btn-serve:hover { background:var(--pms-rail-soft); }
     #dashboard-app .btn-ghost { color:var(--sp-body); border-color:var(--pms-line); }
     #dashboard-app .busy-bar { background:#ebe7db; border-color:var(--pms-gold); }
     @media(max-width:767px){
       #dashboard-app .page { padding:0 16px 32px; }
       #dashboard-app .app-nav { position:static; width:auto; min-height:0; padding:0; flex-direction:row; overflow-x:auto; background:var(--pms-rail); }
       #dashboard-app .app-nav::before { display:none; }
       #dashboard-app .nav-btn { width:auto; flex:0 0 auto; }
     }
   </style>
</head>
<body>

<!-- ─── APP ─── -->
<div id="dashboard-app">

<div class="page">

<!-- HEADER -->
<header class="app-header">
  <div>
    <h1>Stars & Pines</h1>
    <div class="meta">Family Dashboard · Kasar Devi, Almora</div>
  </div>
  <div class="header-actions">
    <label class="operator-picker" for="operator-select">
      <span class="meta">On duty</span>
      <select id="operator-select" onchange="setOperator(this.value)">
        <option value="Amrit">Amrit</option>
        <option value="Raman">Raman</option>
        <option value="Mona">Mona</option>
      </select>
    </label>
    <button class="btn-ghost" onclick="refreshAll()">Refresh</button>
  </div>
</header>

<!-- NAV -->
<nav class="app-nav">
  <button class="nav-btn active" onclick="switchTab('property', this)"><span class="num">01</span>Property</button>
  <button class="nav-btn" onclick="switchTab('kitchen', this)"><span class="num">02</span>Kitchen</button>
  <button class="nav-btn" onclick="switchTab('inventory', this)"><span class="num">03</span>Inventory</button>
  <button class="nav-btn" onclick="switchTab('checkout', this)"><span class="num">04</span>Checkout</button>
</nav>

<!-- 01 PROPERTY -->
<div class="panel active" id="panel-property">
  <div id="overview-block">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <div class="section-title"><span class="num">01.1</span>Rooms</div>
  <div id="room-block">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <div class="section-title" style="margin-top:var(--space-lg)"><span class="num">01.2</span>Current Stays</div>
  <div id="stays-block">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- 02 KITCHEN -->
<div class="panel" id="panel-kitchen">
  <div id="kitchen-overview"></div>
  <div id="kitchen-busy-block"></div>
  <div class="section-title"><span class="num">02.1</span>Orders</div>
  <div id="kitchen-block">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- 03 INVENTORY -->
<div class="panel" id="panel-inventory">
  <div id="inv-alert-block"></div>
  <div id="inv-block">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- 04 CHECKOUT -->
<div class="panel" id="panel-checkout">
  <div class="section-title"><span class="num">04.1</span>Active Stays</div>
  <div id="checkout-block">
    <div class="loading"><div class="spinner"></div></div>
  </div>
  <div id="checkout-bill-block" style="display:none"></div>
</div>

</div><!-- .page -->
</div><!-- #dashboard-app -->

<div class="toast" id="toast"></div>

<script src="../shared/api.js"></script>
<script>
let dashboardData = null;
let refreshInterval = null;
let currentStaff = { name: 'Amrit' };

function setOperator(name) {
  currentStaff = { name: name };
}

// ─── NAV ───
function switchTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'checkout') loadCheckout();
}

// ─── REFRESH ───
async function refreshAll() {
  try {
    dashboardData = await API.getDashboard();
    renderProperty();
    renderKitchen();
    renderInventory();
  } catch (e) {}
}

// ─── 01 PROPERTY ───
function renderProperty() {
  const d = dashboardData;
  if (!d) return;
  const occ = d.occupancy?.property || {};
  const rev = d.revenue || {};

  document.getElementById('overview-block').innerHTML = `
    <div class="overview">
      <div class="overview-cell">
        <div class="overview-value">${occ.occupancy_rate || 0}%</div>
        <div class="overview-label">Occupancy</div>
      </div>
      <div class="overview-cell">
        <div class="overview-value ${occ.occupied_beds > 0 ? 'ok' : ''}">${occ.occupied_beds || 0} / ${occ.total_beds || 0}</div>
        <div class="overview-label">Beds occupied</div>
      </div>
      <div class="overview-cell">
        <div class="overview-value">₹${(rev.food_orders?.total || 0).toFixed(0)}</div>
        <div class="overview-label">Food revenue</div>
      </div>
      <div class="overview-cell">
        <div class="overview-value ${d.inventory?.low_stock_count > 0 ? 'warn' : ''}">${d.inventory?.low_stock_count || 0}</div>
        <div class="overview-label">Low stock</div>
      </div>
    </div>
  `;

  const rooms = d.occupancy?.rooms || [];
  let roomHtml = '<table class="room-table"><thead><tr><th>Room</th><th>Type</th><th>Status</th><th>Guest</th></tr></thead><tbody>';
  rooms.forEach(r => {
    const beds = r.beds && r.beds.length > 0 ? r.beds : (r.guest ? [{label: 'Room', is_occupied: true, guest_name: r.guest.guest_name}] : [{label: 'Room', is_occupied: false}]);
    const occupied = beds.filter(b => b.is_occupied).length;
    const total = beds.length;
    const guestNames = beds.filter(b => b.is_occupied && b.guest_name).map(b => b.guest_name).join(', ');
    roomHtml += `<tr>
      <td><span class="room-name">${r.name}</span></td>
      <td><span class="room-type">${r.type} · ₹${r.base_price}</span></td>
      <td><span class="status"><span class="status-dot ${occupied > 0 ? 'occupied' : 'available'}"></span>${occupied}/${total}</span></td>
      <td>${guestNames ? `<span class="guest-name">${guestNames}</span>` : '<span class="vacant">Vacant</span>'}</td>
    </tr>`;
  });
  roomHtml += '</tbody></table>';
  document.getElementById('room-block').innerHTML = roomHtml;

  const stays = d.departures || [];
  if (stays.length === 0) {
    document.getElementById('stays-block').innerHTML = '<div class="empty">No active stays</div>';
  } else {
    let stayHtml = '<table class="room-table"><thead><tr><th>Guest</th><th>Room</th><th>Phone</th></tr></thead><tbody>';
    stays.forEach(s => {
      stayHtml += `<tr>
        <td><span class="guest-name">${s.guest_name}</span></td>
        <td><span class="room-type">${s.room_name}${s.bed_label ? ' · ' + s.bed_label : ''}</span></td>
        <td><span class="mono">${s.guest_phone || '—'}</span></td>
      </tr>`;
    });
    stayHtml += '</tbody></table>';
    document.getElementById('stays-block').innerHTML = stayHtml;
  }
}

// ─── 02 KITCHEN ───
function renderKitchen() {
  const d = dashboardData;
  if (!d) return;
  const stats = d.kitchen?.stats || {};
  document.getElementById('kitchen-overview').innerHTML = `
    <div class="overview" style="margin-bottom:var(--space-lg)">
      <div class="overview-cell">
        <div class="overview-value warn">${stats.pending || 0}</div>
        <div class="overview-label">Pending</div>
      </div>
      <div class="overview-cell">
        <div class="overview-value">${stats.preparing || 0}</div>
        <div class="overview-label">Preparing</div>
      </div>
      <div class="overview-cell">
        <div class="overview-value ok">${stats.served || 0}</div>
        <div class="overview-label">Served</div>
      </div>
      <div class="overview-cell">
        <div class="overview-value">₹${(stats.total_revenue || 0).toFixed(0)}</div>
        <div class="overview-label">Revenue</div>
      </div>
    </div>
  `;

  const queue = d.kitchen?.queue || [];
  const active = queue.filter(o => o.status === 'pending' || o.status === 'preparing');

  if (active.length > 0) {
    const items = [];
    active.forEach(o => { (o.items || []).forEach(i => items.push(`${i.quantity}x ${i.item_name}`)); });
    const eta = active.some(o => o.status === 'pending') ? '~30 min' : '~15 min';
    document.getElementById('kitchen-busy-block').innerHTML = `
      <div class="busy-bar">
        <div class="busy-title">Kitchen busy — ${active.length} order${active.length > 1 ? 's' : ''}</div>
        <div class="busy-items">${items.join(', ')}</div>
        <div class="busy-eta">ETA: ${eta}</div>
      </div>
    `;
  } else {
    document.getElementById('kitchen-busy-block').innerHTML = '';
  }

  if (queue.length === 0) {
    document.getElementById('kitchen-block').innerHTML = '<div class="empty">No orders</div>';
    return;
  }

  let html = '<ul class="kitchen-list">';
  queue.forEach(o => {
    const created = new Date(o.created_at);
    const elapsed = Math.round((Date.now() - created.getTime()) / 60000);
    const timeStr = created.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const statusLabel = o.status === 'pending' ? 'Pending' : o.status === 'preparing' ? 'Preparing' : o.status === 'served' ? 'Complete' : o.status;
    html += `<li class="kitchen-item">
      <div class="kitchen-time">${timeStr}<br/>${elapsed}m</div>
      <div>
        <div class="kitchen-room">${o.table_label || o.room_name || 'Walk-in'}</div>
        <ul class="kitchen-items">
          ${(o.items || []).map(i => `<li><span class="qty">${i.quantity}x</span>${i.item_name}${i.notes ? ' (' + i.notes + ')' : ''}</li>`).join('')}
        </ul>
      </div>
      <div><span class="status"><span class="status-dot ${o.status}"></span>${statusLabel}</span></div>
      <div class="kitchen-actions">
        ${o.status === 'pending' ? `<button class="btn btn-start" onclick="updateOrder('${o.id}','preparing')">Start</button>` : ''}
        ${o.status === 'preparing' ? `<button class="btn btn-serve" onclick="updateOrder('${o.id}','served')">Serve</button>` : ''}
        ${o.status !== 'served' && o.status !== 'cancelled' ? `<button class="btn btn-cancel" onclick="updateOrder('${o.id}','cancelled')">Void</button>` : ''}
      </div>
    </li>`;
  });
  html += '</ul>';
  document.getElementById('kitchen-block').innerHTML = html;
}

async function updateOrder(id, status) {
  try {
    await API.updateOrderStatus(id, status, currentStaff.name);
    showToast('Order ' + status);
    refreshAll();
  } catch (e) { showToast('Failed: ' + e.message); }
}

// ─── 03 INVENTORY ───
function renderInventory() {
  const d = dashboardData;
  if (!d) return;
  const inv = d.inventory || {};

  if (inv.low_stock_count > 0) {
    let alertHtml = `<div class="alert-banner"><div class="alert-title">Low Stock — ${inv.low_stock_count} item${inv.low_stock_count > 1 ? 's' : ''}</div>`;
    inv.low_stock.forEach(i => { alertHtml += `<div class="alert-item">${i.name}: ${i.current_stock} / ${i.threshold} ${i.unit}</div>`; });
    alertHtml += '</div>';
    document.getElementById('inv-alert-block').innerHTML = alertHtml;
  } else {
    document.getElementById('inv-alert-block').innerHTML = '';
  }

  let html = '';
  for (const [catName, catData] of Object.entries(inv.categories || {})) {
    html += `<div class="section-title" style="margin-top:var(--space-lg)">${catName}</div>`;
    html += '<table class="inv-table"><thead><tr><th>Item</th><th>Stock</th><th class="actions">Actions</th></tr></thead><tbody>';
    catData.items.forEach(i => {
      const stockClass = i.current_stock <= i.threshold ? 'stock-low' : 'stock-ok';
      html += `<tr>
        <td>${i.name}</td>
        <td class="${stockClass}">${i.current_stock} ${i.unit} <span style="color:var(--sp-faint)">(min ${i.threshold})</span></td>
        <td class="actions">
          <button class="inv-btn" onclick="restockItem('${i.id}','${i.name}')">+ In</button>
          <button class="inv-btn" onclick="consumeItem('${i.id}','${i.name}')">− Out</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table>';
  }
  document.getElementById('inv-block').innerHTML = html || '<div class="empty">No inventory data</div>';
}

async function restockItem(id, name) {
  const qty = prompt('Restock ' + name + ' — quantity?');
  if (!qty || isNaN(qty)) return;
  try {
    await API.restockItem({ item_id: id, quantity: parseFloat(qty), logged_by: currentStaff.name });
    showToast(name + ' + ' + qty);
    refreshAll();
  } catch (e) { showToast('Failed: ' + e.message); }
}

async function consumeItem(id, name) {
  const qty = prompt('Consume ' + name + ' — quantity?');
  if (!qty || isNaN(qty)) return;
  try {
    await API.consumeItem({ item_id: id, quantity: parseFloat(qty), logged_by: currentStaff.name });
    showToast(name + ' − ' + qty);
    refreshAll();
  } catch (e) { showToast('Failed: ' + e.message); }
}

// ─── 04 CHECKOUT ───
async function loadCheckout() {
  try {
    const data = await API.getDepartures();
    if (data.length === 0) {
      document.getElementById('checkout-block').innerHTML = '<div class="empty">No active stays</div>';
      return;
    }
    let html = '<ul class="checkout-list">';
    data.forEach(s => {
      const since = new Date(s.check_in).toLocaleDateString();
      html += `<li class="checkout-item">
        <div>
          <div class="checkout-guest">${s.guest_name}</div>
          <div class="checkout-meta">${s.room_name}${s.bed_label ? ' · ' + s.bed_label : ''} · Since ${since}</div>
        </div>
        <button class="btn btn-primary" onclick="showBill('${s.id}','${s.guest_name}')">Bill</button>
      </li>`;
    });
    html += '</ul>';
    document.getElementById('checkout-block').innerHTML = html;
  } catch (e) {
    document.getElementById('checkout-block').innerHTML = '<div class="empty" style="color:var(--sp-alert)">Failed to load</div>';
  }
}

async function showBill(stayId, guestName) {
  try {
    const bill = await API.getBill(stayId);
    const block = document.getElementById('checkout-bill-block');
    block.style.display = 'block';

    let lines = bill.entries.map(e =>
      `<div class="bill-line ${e.entry_type === 'payment' ? 'payment' : ''}">
        <span class="bill-desc">${e.description}</span>
        <span class="bill-amount">${e.amount >= 0 ? '₹' + e.amount.toFixed(0) : '−₹' + Math.abs(e.amount).toFixed(0)}</span>
      </div>`
    ).join('');

    block.innerHTML = `
      <div class="bill">
        <div class="bill-title">${guestName}</div>
        <div class="bill-sub">Ledger</div>
        ${lines || '<div class="empty">No entries</div>'}
        <div class="bill-total">
          <span>Balance</span>
          <span>₹${bill.balance.toFixed(0)}</span>
        </div>
        <div style="margin-top:var(--space-md)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Amount</label>
              <input class="form-input" id="pay-amount" type="number" value="${bill.balance}" />
            </div>
            <div class="form-group">
              <label class="form-label">Method</label>
              <select class="form-select" id="pay-method">
                <option value="cash">Cash</option>
                <option value="upi">UPI</option>
                <option value="card">Card</option>
              </select>
            </div>
          </div>
          <button class="btn btn-primary btn-full" onclick="recordPayment('${stayId}')">Record Payment</button>
          <button class="btn btn-full" style="margin-top:var(--space-xs);background:var(--sp-alert);color:white" onclick="confirmCheckout('${stayId}','${guestName}')">Complete Checkout</button>
        </div>
      </div>
    `;
  } catch (e) { showToast('Failed: ' + e.message); }
}

async function recordPayment(stayId) {
  const amount = parseFloat(document.getElementById('pay-amount').value);
  const method = document.getElementById('pay-method').value;
  try {
    await API.recordPayment({ stay_id: stayId, amount, method, collected_by: currentStaff.name });
    showToast('Payment recorded');
    showBill(stayId, '');
  } catch (e) { showToast('Failed: ' + e.message); }
}

function confirmCheckout(stayId, guestName) {
  if (!confirm('Checkout ' + guestName + '?')) return;
  API.checkout(stayId, currentStaff.name).then(() => {
    showToast(guestName + ' checked out');
    document.getElementById('checkout-bill-block').style.display = 'none';
    loadCheckout();
    refreshAll();
  }).catch(e => showToast('Failed: ' + e.message));
}

refreshAll();
refreshInterval = setInterval(refreshAll, 30000);

// ─── TOAST ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('visible'), 2500);
}
</script>
</body>
</html>
