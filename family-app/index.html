<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f8f8f6" />
  <title>Stars & Pines — Family Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sp-ink:        #1a1714;
      --sp-ink-soft:   #3a3530;
      --sp-body:       #5a5047;
      --sp-muted:      #8a7e72;
      --sp-faint:      #b0a898;
      --sp-paper:      #f6f1ea;
      --sp-cream:      #f0ebe3;
      --sp-mist:       #e8e2d8;
      --sp-border:     #d4c9b8;
      --sp-border-soft:#e5dcc8;
      --sp-pine:       #2d4030;
      --sp-pine-deep:  #1f2f1d;
      --sp-warm:       #c4a55a;
      --sp-alert:      #b05050;
      --sp-green:      #4a8a62;
      --sp-night:      #131a12;
      --sp-forest:     #253422;
      --sp-font-display: 'Playfair Display', Georgia, serif;
      --sp-font-body:    'EB Garamond', Georgia, serif;
      --sp-font-ui:      'DM Sans', system-ui, sans-serif;
      --sp-font-mono:    'DM Mono', 'SF Mono', monospace;
      --space-xxs: 4px;
      --space-xs:  8px;
      --space-sm:  12px;
      --space-md:  16px;
      --space-lg:  24px;
      --space-xl:  32px;
      --radius-none: 0px;
      --radius-sm:   2px;
      --radius-md:   4px;
      --duration-fast: 150ms;
      --duration-mid:  200ms;
      --ease-in-out:   cubic-bezier(0.645, 0.045, 0.355, 1);
    }

    html, body {
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #f8f8f6;
      color: var(--sp-ink);
      font-family: var(--sp-font-ui);
      font-weight: 400;
      line-height: 1.5;
    }

    /* ─── HEADER ─── */
    .dash-header {
      padding: 16px 20px;
      background: white;
      border-bottom: 1px solid rgba(122,98,72,0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-header h1 {
      font-family: var(--sp-font-display);
      font-size: 1.1rem;
      color: var(--sp-pine);
    }
    .dash-header .sub {
      font-size: 0.6rem;
      color: var(--sp-muted);
      letter-spacing: 0.1em;
    }
    .refresh-btn {
      background: none;
      border: 1px solid rgba(122,98,72,0.18);
      color: var(--sp-muted);
      padding: 6px 12px;
      border-radius: var(--radius-none);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--sp-font-ui);
    }
    .refresh-btn:hover { border-color: var(--sp-warm); }

    /* ─── TAB BAR ─── */
    .tab-bar {
      display: flex;
      background: white;
      border-bottom: 1px solid rgba(122,98,72,0.12);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 12px 16px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sp-muted);
      transition: all 0.2s;
      white-space: nowrap;
      font-family: var(--sp-font-ui);
    }
    .tab-btn.active { border-bottom-color: var(--sp-warm); color: var(--sp-pine); font-weight: 500; }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    /* ─── STAT CARDS ─── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      border: 1px solid rgba(122,98,72,0.12);
      border-radius: var(--radius-none);
      padding: 14px;
      text-align: center;
    }
    .stat-value {
      font-family: var(--sp-font-display);
      font-size: 1.6rem;
      color: var(--sp-pine);
    }
    .stat-label {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sp-muted);
      margin-top: 4px;
    }
    .stat-card.warning .stat-value { color: var(--sp-alert); }
    .stat-card.success .stat-value { color: var(--sp-green); }
    .stat-card.danger .stat-value { color: var(--sp-alert); }

    /* ─── CARDS ─── */
    .card {
      background: white;
      border: 1px solid rgba(122,98,72,0.12);
      border-radius: var(--radius-none);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-family: var(--sp-font-display);
      font-size: 0.95rem;
      color: var(--sp-pine);
      margin-bottom: 10px;
    }
    .card-subtitle { font-size: 0.65rem; color: var(--sp-muted); }

    /* ─── ROOM/BED GRID ─── */
    .room-grid { display: flex; flex-direction: column; gap: 10px; }
    .room-card {
      background: white;
      border: 1px solid rgba(122,98,72,0.12);
      border-radius: var(--radius-none);
      overflow: hidden;
    }
    .room-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f8f6;
    }
    .room-header .name { font-weight: 500; }
    .room-header .type { font-size: 0.6rem; color: var(--sp-muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .room-header .badge {
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }
    .room-header .badge.occupied { background: rgba(176,80,80,0.12); color: var(--sp-alert); }
    .room-header .badge.available { background: rgba(74,138,98,0.12); color: var(--sp-green); }
    .beds-row {
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .bed-chip {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      border: 1px solid rgba(122,98,72,0.12);
    }
    .bed-chip.occupied {
      background: rgba(176,80,80,0.08);
      border-color: rgba(176,80,80,0.2);
      color: var(--sp-alert);
    }
    .bed-chip.free {
      background: rgba(74,138,98,0.08);
      border-color: rgba(74,138,98,0.2);
      color: var(--sp-green);
    }
    .bed-chip .guest { font-size: 0.6rem; color: var(--sp-muted); display: block; }

    /* ─── KITCHEN QUEUE ─── */
    .order-card {
      background: white;
      border: 1px solid rgba(122,98,72,0.12);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 8px;
      transition: all 0.3s;
    }
    .order-card.pending {
      border-left: 3px solid #c45a5a;
      animation: orderBlinkRed 1.5s ease-in-out infinite;
    }
    .order-card.preparing {
      border-left: 3px solid #d4b880;
      animation: orderPulseYellow 2s ease-in-out infinite;
    }
    .order-card.served { border-left: 3px solid #4a8a62; opacity: 0.6; }
    .order-card.cancelled { border-left: 3px solid #888; opacity: 0.4; }

    @keyframes orderBlinkRed {
      0%, 100% { border-left-color: #c45a5a; box-shadow: 0 0 0 rgba(196,90,90,0); }
      50% { border-left-color: #e06060; box-shadow: 0 0 12px rgba(196,90,90,0.3); }
    }
    @keyframes orderPulseYellow {
      0%, 100% { border-left-color: #d4b880; }
      50% { border-left-color: #e4c890; }
    }

    .order-status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .order-status.pending { background: rgba(196,90,90,0.15); color: #c45a5a; font-weight: 600; }
    .order-status.preparing { background: rgba(212,184,128,0.15); color: #b89a50; font-weight: 600; }
    .order-status.served { background: rgba(74,138,98,0.15); color: var(--sp-green); }
    .order-status.cancelled { background: rgba(136,136,136,0.1); color: #888; }
    .order-actions { display: flex; gap: 6px; margin-top: 8px; }
    .order-actions button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--sp-font-ui);
    }
    .btn-start { background: var(--sp-warm); color: var(--sp-pine); }
    .btn-serve { background: var(--sp-green); color: white; }
    .btn-cancel { background: rgba(176,80,80,0.12); color: var(--sp-alert); }

    /* ─── INVENTORY ─── */
    .inv-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(122,98,72,0.08);
    }
    .inv-item:last-child { border-bottom: none; }
    .inv-item .name { font-weight: 500; }
    .inv-item .stock { font-size: 0.82rem; }
    .inv-item .stock.low { color: var(--sp-alert); font-weight: 500; }
    .inv-item .stock.ok { color: var(--sp-green); }
    .inv-btn {
      padding: 4px 10px;
      border: 1px solid rgba(122,98,72,0.18);
      border-radius: var(--radius-sm);
      background: none;
      font-size: 0.6rem;
      cursor: pointer;
      color: var(--sp-muted);
      font-family: var(--sp-font-ui);
    }
    .inv-btn:hover { border-color: var(--sp-warm); color: var(--sp-pine); }

    /* ─── SECTION ─── */
    .section-label {
      font-size: 0.55rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--sp-muted);
      margin-bottom: 12px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label:first-child { margin-top: 0; }
    .section-label::before {
      content: '';
      width: 16px;
      height: 1px;
      background: var(--sp-muted);
      opacity: 0.3;
    }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--sp-pine);
      color: var(--sp-cream);
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      z-index: 1000;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(19,26,18,0.2);
    }
    .toast.visible { transform: translateX(-50%) translateY(0); }

    /* ─── LOADING ─── */
    .loading { text-align: center; padding: 40px; color: var(--sp-muted); }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(122,98,72,0.12);
      border-top-color: var(--sp-warm);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── BILL ─── */
    .bill-line {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(122,98,72,0.08);
      font-size: 0.88rem;
    }
    .bill-line:last-child { border-bottom: none; }
    .bill-line .desc { color: var(--sp-ink); }
    .bill-line .amount { font-weight: 500; }
    .bill-line.payment .amount { color: var(--sp-green); }
    .bill-total {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      font-size: 1.1rem;
      font-weight: 500;
      border-top: 2px solid var(--sp-pine);
      margin-top: 8px;
    }

    /* ─── FORMS ─── */
    .form-group { margin-bottom: 12px; }
    .form-label {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sp-muted);
      margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(122,98,72,0.18);
      border-radius: var(--radius-none);
      font-size: 0.88rem;
      font-family: var(--sp-font-ui);
      background: #f8f8f6;
      color: var(--sp-ink);
      outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--sp-warm); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius-none);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--sp-font-ui);
    }
    .btn-primary { background: var(--sp-pine); color: white; }
    .btn-primary:hover { background: var(--sp-pine-deep); }
    .btn-success { background: var(--sp-green); color: white; }
    .btn-warning { background: var(--sp-alert); color: white; }
    .btn-danger { background: var(--sp-alert); color: white; }
    .btn-full { width: 100%; }

    /* ─── AUTH SCREEN ─── */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      background: var(--sp-paper);
    }
    .auth-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
    }
    .auth-title {
      font-family: var(--sp-font-display);
      font-size: 24px;
      color: var(--sp-pine);
      margin-bottom: 8px;
    }
    .auth-sub {
      font-size: 14px;
      color: var(--sp-muted);
      margin-bottom: 32px;
      max-width: 280px;
      line-height: 1.6;
    }
    .auth-form {
      width: 100%;
      max-width: 320px;
    }
    .auth-form .form-group {
      margin-bottom: 16px;
    }
    .auth-form .pin-input {
      font-family: var(--sp-font-mono);
      font-size: 28px;
      text-align: center;
      letter-spacing: 8px;
      padding: 16px;
      border-radius: var(--radius-none);
    }
    .auth-error {
      color: var(--sp-alert);
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .auth-footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--sp-faint);
    }
  </style>
</head>
<body>

<!-- ─── AUTH SCREEN ─── -->
<div id="auth-screen" class="auth-screen">
  <svg class="auth-logo" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="30" stroke="#2d4030" stroke-width="2"/>
    <path d="M32 10 L35 22 L48 22 L38 30 L42 42 L32 34 L22 42 L26 30 L16 22 L29 22Z" fill="#2d4030" opacity="0.8"/>
  </svg>
  <div class="auth-title">Stars & Pines</div>
  <div class="auth-sub">Family Dashboard — Staff Access</div>
  <div class="auth-form">
    <div class="form-group">
      <label class="form-label" for="auth-staff-id">Staff ID</label>
      <input class="form-input" id="auth-staff-id" type="text" placeholder="S02" autocomplete="off" />
    </div>
    <div class="form-group">
      <label class="form-label" for="auth-pin">PIN</label>
      <input class="form-input pin-input" id="auth-pin" type="password" maxlength="4" placeholder="••••" autocomplete="off" />
    </div>
    <button class="btn btn-primary btn-full" onclick="staffLogin()">Enter Dashboard</button>
    <div class="auth-error" id="auth-error">Invalid Staff ID or PIN</div>
  </div>
  <div class="auth-footer">Stars & Pines · Kasar Devi · Almora</div>
</div>

<!-- ─── DASHBOARD (hidden until authenticated) ─── -->
<div id="dashboard-app" style="display:none">

<!-- ─── HEADER ─── -->
<div class="dash-header">
  <div>
    <h1>Stars & Pines</h1>
    <div class="sub">Family Dashboard · <span id="staff-display-name">Staff</span></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="refresh-btn" onclick="refreshAll()">Refresh</button>
    <button class="refresh-btn" onclick="staffLogout()" style="color:var(--sp-alert);border-color:rgba(176,80,80,0.2)">Logout</button>
  </div>
</div>

<!-- ─── TAB BAR ─── -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('dashboard', this)">Dashboard</button>
  <button class="tab-btn" onclick="switchTab('kitchen', this)">Kitchen</button>
  <button class="tab-btn" onclick="switchTab('inventory', this)">Inventory</button>
  <button class="tab-btn" onclick="switchTab('checkout', this)">Checkout</button>
</div>

<!-- ─── DASHBOARD TAB ─── -->
<div class="tab-content active" id="panel-dashboard">
  <div class="stats-row" id="stats-row">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <div class="section-label">Room & Bed Grid</div>
  <div class="room-grid" id="room-grid">
    <div class="loading"><div class="spinner"></div>Loading rooms...</div>
  </div>

  <div class="section-label">Active Stays</div>
  <div id="active-stays">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- ─── KITCHEN TAB ─── -->
<div class="tab-content" id="panel-kitchen">
  <div class="stats-row" id="kitchen-stats">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <div class="section-label">Kitchen Queue</div>
  <div id="kitchen-busy-bar" style="display:none"></div>
  <div id="kitchen-queue">
    <div class="loading"><div class="spinner"></div>Loading orders...</div>
  </div>
</div>

<!-- ─── INVENTORY TAB ─── -->
<div class="tab-content" id="panel-inventory">
  <div id="inventory-content">
    <div class="loading"><div class="spinner"></div>Loading inventory...</div>
  </div>
</div>

<!-- ─── CHECKOUT TAB ─── -->
<div class="tab-content" id="panel-checkout">
  <div class="section-label">Active Stays</div>
  <div id="checkout-stays">
    <div class="loading"><div class="spinner"></div>Loading...</div>
  </div>
  <div id="checkout-bill" style="display:none"></div>
</div>

</div><!-- end dashboard-app -->

<!-- ─── TOAST ─── -->
<div class="toast" id="toast"></div>

<script src="../shared/api.js"></script>
<script>
// ─── STATE ───
let dashboardData = null;
let refreshInterval = null;

// ─── INIT ───
// Auth gate controls when refreshAll starts — see staffLogin()

// ─── TABS ───
function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'checkout') loadCheckoutStays();
}

// ─── REFRESH ALL ───
async function refreshAll() {
  try {
    dashboardData = await API.getDashboard();
    renderDashboard();
    renderKitchen();
    renderInventory();
  } catch (e) {
    // Silently fail on refresh
  }
}

// ─── DASHBOARD ───
function renderDashboard() {
  const d = dashboardData;
  if (!d) return;

  const occ = d.occupancy?.property || {};
  const rev = d.revenue || {};
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${occ.occupancy_rate || 0}%</div>
      <div class="stat-label">Occupancy</div>
    </div>
    <div class="stat-card success">
      <div class="stat-value">${occ.occupied_beds || 0}/${occ.total_beds || 0}</div>
      <div class="stat-label">Beds</div>
    </div>
    <div class="stat-card warning">
      <div class="stat-value">₹${(rev.food_orders?.total || 0).toFixed(0)}</div>
      <div class="stat-label">Food</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">₹${(rev.payments_received?.total || 0).toFixed(0)}</div>
      <div class="stat-label">Payments</div>
    </div>
    ${d.inventory?.low_stock_count > 0 ? `
    <div class="stat-card danger">
      <div class="stat-value">${d.inventory.low_stock_count}</div>
      <div class="stat-label">Low Stock</div>
    </div>` : ''}
  `;

  // Room grid
  const rooms = d.occupancy?.rooms || [];
  document.getElementById('room-grid').innerHTML = rooms.map(r => {
    const bedsHtml = r.beds && r.beds.length > 0
      ? r.beds.map(b => `
          <div class="bed-chip ${b.is_occupied ? 'occupied' : 'free'}">
            ${b.label}
            ${b.guest_name ? `<span class="guest">${b.guest_name}</span>` : ''}
          </div>
        `).join('')
      : (r.guest ? `<div class="bed-chip occupied">${r.guest.guest_name || 'Guest'}</div>` : '<div class="bed-chip free">Vacant</div>');

    return `
      <div class="room-card">
        <div class="room-header">
          <div>
            <div class="name">${r.name}</div>
            <div class="type">${r.type} · ₹${r.base_price}</div>
          </div>
          <span class="badge ${r.is_occupied ? 'occupied' : 'available'}">
            ${r.is_occupied ? `${r.occupied_beds}/${r.total_beds}` : 'Vacant'}
          </span>
        </div>
        <div class="beds-row">${bedsHtml}</div>
      </div>
    `;
  }).join('');

  // Active stays
  const stays = d.departures || [];
  document.getElementById('active-stays').innerHTML = stays.length > 0
    ? stays.map(s => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div class="card-title">${s.guest_name}</div>
              <div class="card-subtitle">${s.room_name}${s.bed_label ? ' · ' + s.bed_label : ''} · ${s.guest_phone}</div>
            </div>
          </div>
        </div>
      `).join('')
    : '<div style="text-align:center;padding:20px;color:var(--sp-muted)">No active stays</div>';
}

// ─── KITCHEN ───
function renderKitchen() {
  const d = dashboardData;
  if (!d) return;

  const stats = d.kitchen?.stats || {};
  document.getElementById('kitchen-stats').innerHTML = `
    <div class="stat-card warning">
      <div class="stat-value">${stats.pending || 0}</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${stats.preparing || 0}</div>
      <div class="stat-label">Preparing</div>
    </div>
    <div class="stat-card success">
      <div class="stat-value">${stats.served || 0}</div>
      <div class="stat-label">Served</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">₹${(stats.total_revenue || 0).toFixed(0)}</div>
      <div class="stat-label">Revenue</div>
    </div>
  `;

  const queue = d.kitchen?.queue || [];
  const activeOrders = queue.filter(o => o.status === 'pending' || o.status === 'preparing');

  // Persistent busy bar
  const busyBar = document.getElementById('kitchen-busy-bar');
  if (activeOrders.length > 0) {
    const items = [];
    activeOrders.forEach(o => {
      (o.items || []).forEach(i => {
        items.push(`${i.quantity}x ${i.item_name}`);
      });
    });
    busyBar.style.display = 'block';
    busyBar.innerHTML = `
      <div class="card" style="border-color:rgba(196,90,90,0.3);background:rgba(196,90,90,0.05);">
        <div class="card-title" style="color:#c45a5a;">🍳 Kitchen Busy — ${activeOrders.length} order${activeOrders.length > 1 ? 's' : ''}</div>
        <div style="font-size:0.82rem;color:var(--sp-muted);">${items.join(', ')}</div>
        <div style="font-size:0.72rem;color:var(--sp-warm);margin-top:4px;">ETA: ~${activeOrders.some(o => o.status === 'pending') ? '30' : '15'} min</div>
      </div>
    `;
  } else {
    busyBar.style.display = 'none';
  }

  document.getElementById('kitchen-queue').innerHTML = queue.length > 0
    ? queue.map(o => {
        const created = new Date(o.created_at);
        const elapsed = Math.round((Date.now() - created.getTime()) / 60000);
        const eta = o.status === 'pending' ? '~30 min' : o.status === 'preparing' ? '~15 min' : '';
        return `
        <div class="order-card ${o.status}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <div>
              <div style="font-weight:500;">${o.table_label || o.room_name || 'Walk-in'}</div>
              <div style="font-size:0.65rem;color:var(--sp-muted);">${created.toLocaleTimeString()} · ${elapsed}m ago${eta ? ' · ETA ' + eta : ''}</div>
            </div>
            <span class="order-status ${o.status}">${o.status === 'pending' ? '🔴 Placed' : o.status === 'preparing' ? '🟡 Processing' : o.status === 'served' ? '🟢 Done' : o.status}</span>
          </div>
          ${o.items.map(i => `
            <div style="font-size:0.82rem;padding:2px 0;">${i.quantity}x ${i.item_name}${i.notes ? ' (' + i.notes + ')' : ''}</div>
          `).join('')}
          <div class="order-actions">
            ${o.status === 'pending' ? `<button class="btn-start" onclick="updateOrder('${o.id}', 'preparing')">Start</button>` : ''}
            ${o.status === 'preparing' ? `<button class="btn-serve" onclick="updateOrder('${o.id}', 'served')">Served</button>` : ''}
            <button class="btn-cancel" onclick="updateOrder('${o.id}', 'cancelled')">Cancel</button>
          </div>
        </div>
      `;
    }).join('')
    : '<div style="text-align:center;padding:40px;color:var(--sp-muted)">No pending orders</div>';
}

async function updateOrder(orderId, status) {
  try {
    await API.updateOrderStatus(orderId, status, 'Staff');
    showToast(`Order ${status}`);
    refreshAll();
  } catch (e) {
    showToast(`Failed: ${e.message}`);
  }
}

// ─── INVENTORY ───
function renderInventory() {
  const d = dashboardData;
  if (!d) return;

  const inv = d.inventory || {};
  let html = '';

  if (inv.low_stock_count > 0) {
    html += `<div class="card" style="border-color:rgba(176,80,80,0.3);">
      <div class="card-title" style="color:var(--sp-alert);">⚠ Low Stock (${inv.low_stock_count})</div>
      ${inv.low_stock.map(i => `
        <div class="inv-item">
          <div class="name">${i.name}</div>
          <div class="stock low">${i.current_stock} / ${i.threshold} ${i.unit}</div>
        </div>
      `).join('')}
    </div>`;
  }

  for (const [catName, catData] of Object.entries(inv.categories || {})) {
    html += `<div class="card">
      <div class="card-title">${catName}</div>
      ${catData.items.map(i => `
        <div class="inv-item">
          <div>
            <div class="name">${i.name}</div>
            <div style="font-size:0.65rem;color:var(--sp-muted);">${i.current_stock} ${i.unit} (min: ${i.threshold})</div>
          </div>
          <div style="display:flex;gap:4px;">
            <button class="inv-btn" onclick="restockItem('${i.id}', '${i.name}')">+ Restock</button>
            <button class="inv-btn" onclick="consumeItem('${i.id}', '${i.name}')">- Use</button>
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  document.getElementById('inventory-content').innerHTML = html || '<div style="text-align:center;padding:40px;color:var(--sp-muted)">No inventory data</div>';
}

async function restockItem(itemId, itemName) {
  const qty = prompt(`Restock ${itemName} — quantity?`);
  if (!qty || isNaN(qty)) return;
  try {
    await API.restockItem({ item_id: itemId, quantity: parseFloat(qty), logged_by: 'Staff' });
    showToast(`${itemName} restocked +${qty}`);
    refreshAll();
  } catch (e) {
    showToast(`Failed: ${e.message}`);
  }
}

async function consumeItem(itemId, itemName) {
  const qty = prompt(`Consume ${itemName} — quantity?`);
  if (!qty || isNaN(qty)) return;
  try {
    await API.consumeItem({ item_id: itemId, quantity: parseFloat(qty), logged_by: 'Staff' });
    showToast(`${itemName} consumed -${qty}`);
    refreshAll();
  } catch (e) {
    showToast(`Failed: ${e.message}`);
  }
}

// ─── CHECKOUT ───
async function loadCheckoutStays() {
  try {
    const data = await API.getDepartures();
    const container = document.getElementById('checkout-stays');
    if (data.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--sp-muted)">No active stays</div>';
      return;
    }
    container.innerHTML = data.map(s => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div class="card-title">${s.guest_name}</div>
            <div class="card-subtitle">${s.room_name}${s.bed_label ? ' · ' + s.bed_label : ''} · Since ${new Date(s.check_in).toLocaleDateString()}</div>
          </div>
          <button class="btn btn-warning" onclick="showCheckoutBill('${s.id}', '${s.guest_name}')">Checkout</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('checkout-stays').innerHTML = '<div style="color:var(--sp-alert)">Failed to load stays</div>';
  }
}

async function showCheckoutBill(stayId, guestName) {
  try {
    const bill = await API.getBill(stayId);
    const container = document.getElementById('checkout-bill');
    container.style.display = 'block';

    let lines = bill.entries.map(e => `
      <div class="bill-line ${e.entry_type === 'payment' ? 'payment' : ''}">
        <span class="desc">${e.description}</span>
        <span class="amount">${e.amount >= 0 ? '₹' + e.amount.toFixed(0) : '-₹' + Math.abs(e.amount).toFixed(0)}</span>
      </div>
    `).join('');

    container.innerHTML = `
      <div class="card">
        <div class="card-title">Bill — ${guestName}</div>
        <div class="section-label">Ledger</div>
        ${lines || '<div style="color:var(--sp-muted);font-size:0.82rem">No entries yet</div>'}
        <div class="bill-total">
          <span>Balance</span>
          <span>₹${bill.balance.toFixed(0)}</span>
        </div>
        <div class="section-label">Record Payment</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Amount</label>
            <input class="form-input" id="pay-amount" type="number" value="${bill.balance}" />
          </div>
          <div class="form-group">
            <label class="form-label">Method</label>
            <select class="form-select" id="pay-method">
              <option value="cash">Cash</option>
              <option value="upi">UPI</option>
              <option value="card">Card</option>
            </select>
          </div>
        </div>
        <button class="btn btn-success btn-full" onclick="recordPayment('${stayId}')">Record Payment</button>
        <div style="margin-top:10px">
          <button class="btn btn-danger btn-full" onclick="confirmCheckout('${stayId}', '${guestName}')">Complete Checkout</button>
        </div>
      </div>
    `;
  } catch (e) {
    showToast(`Failed to load bill: ${e.message}`);
  }
}

async function recordPayment(stayId) {
  const amount = parseFloat(document.getElementById('pay-amount').value);
  const method = document.getElementById('pay-method').value;
  try {
    await API.recordPayment({ stay_id: stayId, amount, method, collected_by: 'Staff' });
    showToast('Payment recorded');
    showCheckoutBill(stayId, '');
  } catch (e) {
    showToast(`Payment failed: ${e.message}`);
  }
}

function confirmCheckout(stayId, guestName) {
  if (!confirm(`Checkout ${guestName}? This will close the stay and deactivate their portal.`)) return;
  API.checkout(stayId, 'Staff').then(() => {
    showToast(`${guestName} checked out`);
    document.getElementById('checkout-bill').style.display = 'none';
    loadCheckoutStays();
    refreshAll();
  }).catch(e => showToast(`Checkout failed: ${e.message}`));
}

// ─── TOAST ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('visible'), 3000);
}

// ─── AUTH ───
let currentStaff = null;

function staffLogin() {
  const staffId = document.getElementById('auth-staff-id').value.trim();
  const pin = document.getElementById('auth-pin').value.trim();
  const errorEl = document.getElementById('auth-error');

  if (!staffId || !pin) {
    errorEl.textContent = 'Enter Staff ID and PIN';
    errorEl.style.display = 'block';
    return;
  }

  API.staffLogin(staffId, pin).then(function(staff) {
    currentStaff = staff;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('dashboard-app').style.display = 'block';
    document.getElementById('staff-display-name').textContent = staff.name;
    errorEl.style.display = 'none';
    refreshAll();
    refreshInterval = setInterval(refreshAll, 30000);
  }).catch(function() {
    errorEl.textContent = 'Invalid Staff ID or PIN';
    errorEl.style.display = 'block';
  });
}

function staffLogout() {
  currentStaff = null;
  if (refreshInterval) clearInterval(refreshInterval);
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('dashboard-app').style.display = 'none';
  document.getElementById('auth-staff-id').value = '';
  document.getElementById('auth-pin').value = '';
  document.getElementById('auth-error').style.display = 'none';
}

// Enter key on PIN field
document.getElementById('auth-pin').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') staffLogin();
});

// Check for existing session
(function() {
  // No persistent session for now — require login each time
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('dashboard-app').style.display = 'none';
})();
</script>
</body>
</html>
